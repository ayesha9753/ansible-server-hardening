---
# firewall — UFW: deny everything incoming by default, allow outgoing,
# and open only the ports listed in ufw_allowed_ports (group_vars/all.yml).
# The SSH port is allowed BEFORE UFW is enabled, so enabling the firewall
# cannot cut off the current session.

- name: Allow the configured ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Set UFW default policy — deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default policy — allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "on"

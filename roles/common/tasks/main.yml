---
# common — base system setup: fresh package cache, base packages, timezone.

- name: Update APT cache (at most once per hour)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Set the system timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

---
# updates — turn on unattended-upgrades so security patches land
# automatically without anyone logging in to run apt.

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable automatic upgrades (APT::Periodic settings)
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: auto_updates_enabled

- name: Ensure the unattended-upgrades service is enabled
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
  when: auto_updates_enabled

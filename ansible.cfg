[defaults]
# Default inventory so `ansible-playbook site.yml` works without -i
inventory = inventory/hosts.ini
roles_path = roles
# Reusable roles/facts caching makes repeat runs faster
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 3600

# Host key checking is left ON for safety on real servers.
# For throwaway lab VMs that get rebuilt often, you can disable it by
# running with: ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook site.yml
host_key_checking = True

# Cleaner output: show the module name being run per host
display_skipped_hosts = False
stdout_callback = default

[privilege_escalation]
become = True
become_method = sudo
become_user = root

[ssh_connection]
# Pipelining reuses one SSH connection for many tasks — much faster runs.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

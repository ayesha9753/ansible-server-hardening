# Example inventory — replace the placeholder host with your own server.
#
# First run: connect as root (default on most fresh VPS images) so the
# playbook can create the admin user. After the first successful run,
# switch ansible_user to your admin_user and remove the root entry.

[servers]
vps.example.com ansible_user=root

# Example with a non-standard SSH port and an IP address:
# 203.0.113.10 ansible_user=root ansible_port=22

[servers:vars]
ansible_python_interpreter=/usr/bin/python3
